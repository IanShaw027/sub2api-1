name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build embedded frontend assets
        run: pnpm --dir frontend run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'
      - name: Verify go.mod/go.sum are tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build backend
        working-directory: backend
        run: go build -tags embed ./cmd/server
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build root Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          tags: sub2api:ci
          cache-from: type=gha,scope=sub2api-root-image
          cache-to: type=gha,mode=max,scope=sub2api-root-image
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            DATE=1970-01-01T00:00:00Z
      - name: Build deploy Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: false
          tags: sub2api:deploy-ci
          cache-from: type=gha,scope=sub2api-deploy-image
          cache-to: type=gha,mode=max,scope=sub2api-deploy-image
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            DATE=1970-01-01T00:00:00Z
      - name: Build GoReleaser packaging image
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT
          printf '#!/bin/sh\nexit 0\n' > "${tmpdir}/sub2api"
          chmod +x "${tmpdir}/sub2api"
          mkdir -p "${tmpdir}/deploy" "${tmpdir}/backend"
          cp deploy/docker-entrypoint.sh "${tmpdir}/deploy/docker-entrypoint.sh"
          cp -R backend/resources "${tmpdir}/backend/resources"
          docker build -f Dockerfile.goreleaser -t sub2api:goreleaser-ci "${tmpdir}"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and expanded CI vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend
